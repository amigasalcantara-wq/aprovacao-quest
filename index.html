<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Crônicas da Reitoria: Guardião dos Protocolos</title>
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Fontes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    :root {
      --font-display: 'Press Start 2P', monospace;
      --font-body: 'Inter', sans-serif;

      /* BTS / Borahae Padrão */
      --bg-color: #0b0716;
      --panel-bg: #140d26;
      --panel-border: #6b21a8;
      --accent: #c084fc;
      --accent-glow: rgba(192, 132, 252, 0.3);
      --text: #f3e8ff;
      --text-muted: #a894c2;
      --success: #10b981;
      --error: #f43f5e;
      --warn: #fbbf24;
    }

    body[data-theme="untamed"] {
      --bg-color: #0e0505;
      --panel-bg: #1a0808;
      --panel-border: #881337;
      --accent: #fb7185;
      --accent-glow: rgba(251, 113, 133, 0.3);
      --text: #ffe4e6;
      --text-muted: #b98e94;
      --success: #10b981;
      --error: #ef4444;
      --warn: #f59e0b;
    }

    body[data-theme="ghibli"] {
      --bg-color: #05130b;
      --panel-bg: #092113;
      --panel-border: #15803d;
      --accent: #4ade80;
      --accent-glow: rgba(74, 222, 128, 0.3);
      --text: #dcfce7;
      --text-muted: #82a890;
      --success: #06b6d4;
      --error: #f43f5e;
      --warn: #f59e0b;
    }

    body[data-theme="coraline"] {
      --bg-color: #080a16;
      --panel-bg: #10142a;
      --panel-border: #3730a3;
      --accent: #f472b6;
      --accent-glow: rgba(244, 114, 182, 0.3);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --success: #38bdf8;
      --error: #f43f5e;
      --warn: #fbbf24;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
      overflow-x: hidden;
      user-select: none;
      transition: background-color 0.4s ease;
    }

    .game-wrapper {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* HEADER & TEMAS */
    header {
      background: var(--panel-bg);
      border: 2px solid var(--panel-border);
      border-radius: 8px;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .game-title {
      font-family: var(--font-display);
      font-size: 10px;
      color: var(--accent);
      letter-spacing: 0.5px;
    }

    .theme-picker { display: flex; gap: 4px; }
    .btn-theme {
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--panel-border);
      border-radius: 4px;
      color: var(--text-muted);
      font-size: 11px;
      padding: 4px 8px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-theme.active, .btn-theme:hover { background: var(--accent); color: #000; border-color: var(--accent); }

    /* PLACAR SEMANAL & CÔMODO */
    .battlefield-bar {
      background: var(--panel-bg);
      border: 2px solid var(--warn);
      border-radius: 8px;
      padding: 12px 16px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .duel-compact {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .duelist-tag {
      background: rgba(0,0,0,0.4);
      border: 1.5px solid var(--panel-border);
      padding: 6px 12px;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .duelist-tag.winning { border-color: var(--success); box-shadow: 0 0 10px rgba(16,185,129,0.3); }

    .room-box {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
    }
    select.room-select {
      background: #000;
      color: #fff;
      border: 1px solid var(--warn);
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 12px;
      font-family: var(--font-body);
    }

    /* SELEÇÃO DO JOGADOR LOCAL */
    .player-select {
      display: flex;
      gap: 8px;
    }
    .btn-slot {
      background: rgba(0,0,0,0.3);
      border: 1px dashed var(--panel-border);
      border-radius: 6px;
      padding: 6px 12px;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-slot.active {
      border: 2px solid var(--accent);
      background: var(--accent-glow);
      color: #fff;
    }

    /* TELA DO JOGO (CANVAS 2D) */
    .viewport-box {
      position: relative;
      background: #000;
      border: 3px solid var(--panel-border);
      border-radius: 10px;
      overflow: hidden;
      width: 100%;
      height: 440px;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
    }

    canvas#gameCanvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
    }

    /* HUD SOBREPOSTO */
    .hud-overlay {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
    }

    .badge-stat {
      background: rgba(0,0,0,0.75);
      border: 1px solid var(--accent);
      border-radius: 4px;
      padding: 4px 8px;
      font-family: var(--font-display);
      font-size: 9px;
      color: var(--text);
    }

    /* CAIXA DE DIÁLOGO E INTERAÇÃO (NPC & MISSÕES) */
    .dialogue-modal {
      display: none;
      position: absolute;
      bottom: 12px;
      left: 12px;
      right: 12px;
      background: var(--panel-bg);
      border: 2px solid var(--accent);
      border-radius: 8px;
      padding: 14px 16px;
      z-index: 10;
      box-shadow: 0 4px 15px rgba(0,0,0,0.8);
    }
    .dialogue-modal.active { display: block; animation: slideUp 0.2s ease; }

    .npc-name {
      font-family: var(--font-display);
      font-size: 10px;
      color: var(--warn);
      margin-bottom: 6px;
    }
    .npc-text {
      font-size: 14px;
      line-height: 1.5;
      color: #fff;
      margin-bottom: 12px;
    }

    .mission-interactive {
      background: rgba(0,0,0,0.4);
      border: 1px dashed var(--accent);
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 10px;
    }

    .action-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }

    .btn-act {
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 700;
      padding: 8px 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-act:hover { filter: brightness(1.1); transform: translateY(-1px); }

    .btn-sec {
      background: rgba(255,255,255,0.1);
      color: #fff;
      border: 1px solid var(--panel-border);
      border-radius: 4px;
      font-size: 12px;
      padding: 8px 12px;
      cursor: pointer;
    }

    /* CONTROLES TOUCH PARA DISPOSITIVOS MÓVEIS */
    .touch-controls {
      display: none;
      justify-content: space-between;
      align-items: center;
      background: var(--panel-bg);
      border: 2px solid var(--panel-border);
      border-radius: 8px;
      padding: 10px 16px;
    }

    @media (max-width: 768px) {
      .touch-controls { display: flex; }
      .viewport-box { height: 380px; }
    }

    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 40px);
      grid-template-rows: repeat(3, 40px);
      gap: 4px;
    }
    .dpad button {
      background: rgba(0,0,0,0.5);
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      color: var(--accent);
      font-family: var(--font-display);
      font-size: 12px;
      cursor: pointer;
    }
    .dpad button:active { background: var(--accent); color: #000; }

    .btn-touch-action {
      background: var(--warn);
      color: #000;
      border: none;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(251,191,36,0.3);
    }
    .btn-touch-action:active { transform: scale(0.95); }

    @keyframes slideUp {
      from { transform: translateY(8px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body data-theme="bts">

  <div class="game-wrapper">
    <!-- HEADER -->
    <header>
      <div class="game-title">⚡ CRÔNICAS DA REITORIA // UFBA RPG</div>
      <div class="theme-picker">
        <button class="btn-theme active" onclick="setGameTheme('bts', event)">💜 BTS</button>
        <button class="btn-theme" onclick="setGameTheme('untamed', event)">🏮 Untamed</button>
        <button class="btn-theme" onclick="setGameTheme('ghibli', event)">🌿 Ghibli</button>
        <button class="btn-theme" onclick="setGameTheme('coraline', event)">🗝️ Coraline</button>
      </div>
    </header>

    <!-- PLACAR DE DISPUTA SEMANAL -->
    <div class="battlefield-bar">
      <div class="duel-compact">
        <div class="duelist-tag" id="box-amanda">
          <span style="font-family:var(--font-display); font-size:9px;">👑 AMANDA</span>
          <strong id="pts-amanda" style="font-size:14px; color:var(--accent);">0 pts</strong>
          <span id="relics-amanda" style="font-size:12px; margin-top:2px;"></span>
        </div>
        <span style="font-family:var(--font-display); font-size:10px; color:var(--warn);">VS</span>
        <div class="duelist-tag" id="box-aymara">
          <span style="font-family:var(--font-display); font-size:9px;">🌙 AYMARA</span>
          <strong id="pts-aymara" style="font-size:14px; color:var(--accent);">0 pts</strong>
          <span id="relics-aymara" style="font-size:12px; margin-top:2px;"></span>
        </div>
      </div>

      <div class="room-box">
        <span style="color:var(--warn); font-weight:600;">Cômodo da Rodada:</span>
        <select class="room-select" id="room-target" onchange="syncRoom(this.value)">
          <option value="Cozinha e Louças">🍳 Cozinha & Louças</option>
          <option value="Banheiro Principal">🧼 Banheiro Principal</option>
          <option value="Faxina Completa da Sala">🛋️️ Sala & Poeira</option>
          <option value="Varanda & Plantas">🌿 Varanda & Plantas</option>
          <option value="Troca de Lençóis e Quarto">🛏️ Quarto & Camas</option>
        </select>
      </div>

      <div class="player-select">
        <button class="btn-slot active" id="slot-amanda" onclick="switchUser('amanda')">👑 Amanda</button>
        <button class="btn-slot" id="slot-aymara" onclick="switchUser('aymara')">🌙 Aymara</button>
        <button class="btn-slot" id="slot-teste" onclick="switchUser('teste')">👾 Treino</button>
      </div>
    </div>

    <!-- TELA PRINCIPAL DO RPG EM CANVAS -->
    <div class="viewport-box">
      <canvas id="gameCanvas" width="800" height="400"></canvas>

      <!-- HUD EM TEMPO REAL -->
      <div class="hud-overlay">
        <div class="badge-stat" id="hud-zone">DISTRITO: GABINETE CENTRAL</div>
        <div class="badge-stat" id="hud-stats">MISSÕES: 0 • XP: 0</div>
      </div>

      <!-- MODAL DE DIÁLOGO / GAMEPLAY ATIVA -->
      <div class="dialogue-modal" id="dialogueBox">
        <div class="npc-name" id="npcName">NOME DO NPC</div>
        <div class="npc-text" id="npcText">Fala do NPC com a contextualização do problema.</div>
        <div class="mission-interactive" id="interactiveZone"></div>
        <div class="action-buttons" id="dialogueActions"></div>
      </div>
    </div>

    <!-- CONTROLES MÓVEIS (D-PAD TOUCH) -->
    <div class="touch-controls">
      <div class="dpad">
        <div></div>
        <button onclick="movePlayer(0, -25)">▲</button>
        <div></div>
        <button onclick="movePlayer(-25, 0)">◀</button>
        <div></div>
        <button onclick="movePlayer(25, 0)">▶</button>
        <div></div>
        <button onclick="movePlayer(0, 25)">▼</button>
        <div></div>
      </div>
      <div style="font-size:12px; color:var(--text-muted); text-align:center;">
        Use <strong>W, A, S, D</strong> ou Setas<br>Aproxime e aperte <strong>ESPAÇO</strong>
      </div>
      <button class="btn-touch-action" onclick="triggerInteract()">AÇÃO</button>
    </div>
  </div>

  <script>
    /* =========================================================
       1. CONFIGURAÇÃO SUPABASE
       ========================================================= */
    const SUPABASE_URL = "https://wdbzfymjjlojeewsyfyk.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_0rllOtrm9Tx8d-dRbIeGbg_tGiZmTo2";

    let supabaseClient = null;
    try {
      if (window.supabase) supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    } catch(e) {}

    /* =========================================================
       2. ARQUITETURA DO MUNDO & ZONAS PEDAGÓGICAS
       ========================================================= */
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let currentTheme = "bts";
    let currentUser = "amanda";

    const RELICS = {
      bts: "💜 Microfone Imperial",
      untamed: "🏮 Flauta Chenqing",
      ghibli: "🔥 Chama Calcifer",
      coraline: "🗝️ Chave de Botão"
    };

    // Zonas do Campus
    const ZONES = [
      {
        id: "gabinete",
        name: "Gabinete Central (Regime & Prazos)",
        x: 60, y: 50, w: 160, h: 120,
        color: "#3b1d5a",
        npc: {
          name: "Sifu Wei (Ética & Prazos)",
          role: "Lei 8.112/90",
          symbol: "🏮",
          dialogue: "Um recém-aprovado no concurso da UFBA teve sua nomeação publicada no Diário Oficial. Ele está confuso sobre seus prazos e direitos.",
          mission: {
            title: "Auditoria de Posse & Exercício",
            question: "Qual despacho legal você emitirá para o candidato nomeado?",
            options: [
              { label: "Você tem 30 dias para tomar Posse e, após isso, 15 dias para entrar em Exercício.", correct: true, feedback: "Exato! Art. 13 da Lei 8.112/90: A posse ocorre em 30 dias e o exercício em 15 dias após ela." },
              { label: "Você tem 15 dias para Posse e 30 dias para Exercício.", correct: false, feedback: "Incorreto! A posse tem o prazo maior (30 dias). O exercício é menor (15 dias)." },
              { label: "Você pode entrar em exercício imediatamente sem termo formal de posse.", correct: false, feedback: "Erro grave! Sem posse, o provimento do cargo não se aperfeiçoa." }
            ]
          }
        }
      },
      {
        id: "arquivo",
        name: "Cripta dos Tomos (Arquivologia)",
        x: 580, y: 50, w: 160, h: 120,
        color: "#164e63",
        npc: {
          name: "Gata dos Olhos de Botão (Arquivista)",
          role: "Teoria das 3 Idades",
          symbol: "🗝️",
          dialogue: "O setor de protocolo enviou uma remessa mista de documentos antigos e novos. Precisamos triar cada lote na esteira!",
          mission: {
            title: "Triagem da Teoria das 3 Idades",
            question: "Para onde você despacha a 'Ata Histórica Original de Fundação da UFBA (1946)'?",
            options: [
              { label: "Arquivo Corrente (Uso diário nas mesas dos servidores)", correct: false, feedback: "Não! Arquivo Corrente é para processos em andamento diário." },
              { label: "Arquivo Permanente (Guarda definitiva / Inalienável)", correct: true, feedback: "Correto! Documentos históricos possuem valor probatório secundário perpétuo. Nunca podem ser eliminados!" },
              { label: "Triturador de Descarte (Expurgo administrativo)", correct: false, feedback: "Crime contra o patrimônio histórico! Documentos permanentes são inalienáveis e imprescritíveis (Lei 8.159/91)." }
            ]
          }
        }
      },
      {
        id: "almoxarifado",
        name: "Pátio de Suprimentos (Licitações & ABC)",
        x: 60, y: 230, w: 160, h: 120,
        color: "#713f12",
        npc: {
          name: "Mestre Calcifer (Almoxarife)",
          role: "Lei 14.133/21 & Estoques",
          symbol: "🔥",
          dialogue: "O reitor precisa contratar uma consultoria jurídica singular de notória especialização para um parecer institucional urgente.",
          mission: {
            title: "Balança de Contratação Pública",
            question: "Qual enquadramento da Nova Lei de Licitações (Lei 14.133/21) autoriza essa contratação?",
            options: [
              { label: "Inexigibilidade de Licitação (Inviabilidade de competição por notória especialização)", correct: true, feedback: "Perfeito! Art. 74 da Lei 14.133/21: Inviabilidade de disputa caracteriza Inexigibilidade." },
              { label: "Dispensa de Licitação por Pequeno Valor", correct: false, feedback: "Incorreto! Notória especialização técnica intelectual não é hipótese de dispensa, e sim inexigibilidade." },
              { label: "Pregão Presencial Simplificado", correct: false, feedback: "O pregão é para bens e serviços comuns, nunca para serviços singulares intelectuais com notório especialista." }
            ]
          }
        }
      },
      {
        id: "protocolo",
        name: "Mesa de Redação (Língua Portuguesa)",
        x: 580, y: 230, w: 160, h: 120,
        color: "#4c1d95",
        npc: {
          name: "Comandante Hope (Redação Oficial)",
          role: "Sintaxe & Crase",
          symbol: "💜",
          dialogue: "Revise os comunicados oficiais antes do envio às faculdades. Erros gramaticais comprometem a impessoalidade do órgão!",
          mission: {
            title: "Revisor Oficial de Crase",
            question: "Identifique o despacho no qual a presença do acento grave é estritamente FACULTATIVA:",
            options: [
              { label: "Encaminhe os autos até à recepção central da reitoria.", correct: true, feedback: "Excelente! Após a preposição 'até', o emprego da crase é facultativo ('até a' ou 'até à')." },
              { label: "Entregue a lista de materiais à prazo ao fornecedor.", correct: false, feedback: "Incorreto! Diante de palavra masculina ('prazo') a crase é estritamente proibida." },
              { label: "O servidor dirigiu-se à ela cordialmente.", correct: false, feedback: "Incorreto! Não ocorre crase antes de pronomes pessoais retos ('ela')." }
            ]
          }
        }
      }
    ];

    // Jogador
    const player = {
      x: 400,
      y: 200,
      size: 18,
      speed: 4,
      color: "#c084fc"
    };

    const keys = {};
    window.addEventListener("keydown", e => {
      keys[e.key.toLowerCase()] = true;
      if (e.key === " " || e.key === "Enter") triggerInteract();
    });
    window.addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });

    /* =========================================================
       3. ESTADO LOCAL & SUPABASE
       ========================================================= */
    const LOCAL_KEY = "cronicas_reitoria_rpg_v1";

    function loadSave() {
      try {
        const s = localStorage.getItem(LOCAL_KEY);
        if (s) return JSON.parse(s);
      } catch(e) {}
      return {
        room: "Cozinha e Louças",
        profiles: {
          amanda: { xp: 0, completed: [], relics: [] },
          aymara: { xp: 0, completed: [], relics: [] },
          teste:  { xp: 0, completed: [], relics: [] }
        }
      };
    }

    let gameState = loadSave();

    async function syncCloud() {
      if (!supabaseClient) return;
      try {
        const { data } = await supabaseClient.from('game_state').select('*');
        if (data) {
          data.forEach(r => {
            if (gameState.profiles[r.user_id]) {
              gameState.profiles[r.user_id].xp = r.xp || 0;
              gameState.profiles[r.user_id].relics = r.relics || [];
            }
            if (r.room_target) gameState.room = r.room_target;
          });
          updateHUD();
        }
      } catch(e) {}
    }

    async function pushCloud() {
      localStorage.setItem(LOCAL_KEY, JSON.stringify(gameState));
      if (!supabaseClient) return;
      const u = gameState.profiles[currentUser];
      try {
        await supabaseClient.from('game_state').upsert({
          user_id: currentUser,
          xp: u.xp,
          weekly_right: u.completed.length,
          relics: u.relics,
          room_target: gameState.room,
          updated_at: new Date().toISOString()
        });
      } catch(e) {}
    }

    async function syncRoom(r) {
      gameState.room = r;
      localStorage.setItem(LOCAL_KEY, JSON.stringify(gameState));
      if (supabaseClient) {
        try { await supabaseClient.from('game_state').update({ room_target: r }).neq('user_id', ''); } catch(e) {}
      }
      updateHUD();
    }

    /* =========================================================
       4. GAME LOOP & RENDERIZAÇÃO CANVAS PIXEL ART
       ========================================================= */
    function updateGame() {
      if (keys["w"] || keys["arrowup"]) player.y = Math.max(20, player.y - player.speed);
      if (keys["s"] || keys["arrowdown"]) player.y = Math.min(canvas.height - 20, player.y + player.speed);
      if (keys["a"] || keys["arrowleft"]) player.x = Math.max(20, player.x - player.speed);
      if (keys["d"] || keys["arrowright"]) player.x = Math.min(canvas.width - 20, player.x + player.speed);

      // Detecta zona atual
      let currentZoneName = "PÁTIO CENTRAL";
      ZONES.forEach(z => {
        if (player.x >= z.x && player.x <= z.x + z.w && player.y >= z.y && player.y <= z.y + z.h) {
          currentZoneName = z.name.toUpperCase();
        }
      });
      document.getElementById("hud-zone").innerText = `LOCAL: ${currentZoneName}`;
    }

    function drawGame() {
      // Fundo Campus
      ctx.fillStyle = "#090d16";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Desenha caminhos de pedra em pixel art
      ctx.fillStyle = "#1e293b";
      ctx.fillRect(0, 185, canvas.width, 30);
      ctx.fillRect(385, 0, 30, canvas.height);

      // Desenha as 4 Zonas Administrativas
      ZONES.forEach(z => {
        ctx.fillStyle = z.color;
        ctx.fillRect(z.x, z.y, z.w, z.h);

        ctx.strokeStyle = "rgba(255,255,255,0.2)";
        ctx.lineWidth = 2;
        ctx.strokeRect(z.x, z.y, z.w, z.h);

        // Nome do Setor
        ctx.fillStyle = "#fff";
        ctx.font = "9px 'Press Start 2P'";
        ctx.fillText(z.id.toUpperCase(), z.x + 10, z.y + 20);

        // Ícone do NPC
        ctx.font = "20px serif";
        ctx.fillText(z.npc.symbol, z.x + z.w/2 - 10, z.y + z.h/2 + 8);
      });

      // Desenha o Jogador em Pixel Art
      ctx.fillStyle = player.color;
      ctx.fillRect(player.x - 9, player.y - 9, 18, 18);
      ctx.fillStyle = "#fff";
      ctx.fillRect(player.x - 5, player.y - 5, 3, 3);
      ctx.fillRect(player.x + 2, player.y - 5, 3, 3);

      // Círculo de interação quando perto de um NPC
      const nearby = getNearbyZone();
      if (nearby) {
        ctx.strokeStyle = "#fbbf24";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(player.x, player.y, 22, 0, Math.PI * 2);
        ctx.stroke();

        ctx.fillStyle = "#fbbf24";
        ctx.font = "8px 'Press Start 2P'";
        ctx.fillText("[ESPAÇO]", player.x - 24, player.y - 18);
      }
    }

    function gameLoop() {
      updateGame();
      drawGame();
      requestAnimationFrame(gameLoop);
    }

    /* =========================================================
       5. INTERAÇÃO PEDAGÓGICA & MISSÕES NÃO-QUIZ
       ========================================================= */
    function getNearbyZone() {
      return ZONES.find(z => {
        const cx = z.x + z.w / 2;
        const cy = z.y + z.h / 2;
        const dist = Math.hypot(player.x - cx, player.y - cy);
        return dist < 85;
      });
    }

    function triggerInteract() {
      const zone = getNearbyZone();
      if (!zone) return;

      const modal = document.getElementById("dialogueBox");
      const nameEl = document.getElementById("npcName");
      const textEl = document.getElementById("npcText");
      const zoneEl = document.getElementById("interactiveZone");
      const actEl = document.getElementById("dialogueActions");

      nameEl.innerText = `${zone.npc.symbol} ${zone.npc.name}`;
      textEl.innerText = zone.npc.dialogue;

      zoneEl.innerHTML = `
        <div style="font-size:13px; font-weight:600; color:var(--warn); margin-bottom:6px;">
          MISSÃO: ${zone.npc.mission.title}
        </div>
        <div style="font-size:14px; line-height:1.4; color:#f1f5f9; margin-bottom:10px;">
          ${zone.npc.mission.question}
        </div>
        <div style="display:flex; flex-direction:column; gap:8px;" id="missionOpts"></div>
      `;

      const optsBox = document.getElementById("missionOpts");
      zone.npc.mission.options.forEach((opt, idx) => {
        const b = document.createElement("button");
        b.className = "btn-sec";
        b.style.textAlign = "left";
        b.style.fontSize = "13px";
        b.style.padding = "8px 12px";
        b.innerText = `${String.fromCharCode(65 + idx)}) ${opt.label}`;
        b.onclick = () => solveMission(zone, opt);
        optsBox.appendChild(b);
      });

      actEl.innerHTML = `<button class="btn-sec" onclick="closeDialogue()">Encerrar Conversa</button>`;
      modal.classList.add("active");
    }

    function solveMission(zone, opt) {
      const u = gameState.profiles[currentUser];
      const textEl = document.getElementById("npcText");
      const zoneEl = document.getElementById("interactiveZone");
      const actEl = document.getElementById("dialogueActions");

      if (opt.correct) {
        u.xp += 100;
        if (!u.completed.includes(zone.id)) {
          u.completed.push(zone.id);
          // Desbloqueia relíquia temática
          const relic = RELICS[currentTheme];
          if (!u.relics.includes(relic)) u.relics.push(relic);
        }
        textEl.innerHTML = `🌟 <strong>SUCESSO ADMINISTRATIVO!</strong><br>${opt.feedback}`;
        zoneEl.innerHTML = `
          <div style="color:var(--success); font-weight:700; font-size:13px;">
            +100 XP CONCEDIDO! Conceito consolidado na pasta institucional.
          </div>
        `;
      } else {
        textEl.innerHTML = `⚠ <strong>FALHA NO PROCEDIMENTO:</strong><br>${opt.feedback}`;
        zoneEl.innerHTML = `
          <div style="color:var(--error); font-weight:600; font-size:13px;">
            A regra permaneceu pendente no seu caderno de estudos. Tente novamente!
          </div>
        `;
      }

      pushCloud();
      updateHUD();

      actEl.innerHTML = `
        <button class="btn-act" onclick="closeDialogue()">Continuar Exploração</button>
      `;
    }

    function closeDialogue() {
      document.getElementById("dialogueBox").classList.remove("active");
    }

    function movePlayer(dx, dy) {
      player.x = Math.max(20, Math.min(canvas.width - 20, player.x + dx));
      player.y = Math.max(20, Math.min(canvas.height - 20, player.y + dy));
    }

    /* =========================================================
       6. CONTROLES DE USUÁRIO & HUD
       ========================================================= */
    function setGameTheme(t, e) {
      currentTheme = t;
      document.body.setAttribute("data-theme", t);
      document.querySelectorAll(".btn-theme").forEach(b => b.classList.remove("active"));
      if (e) e.target.classList.add("active");
      player.color = getComputedStyle(document.body).getPropertyValue("--accent").trim();
    }

    function switchUser(uid) {
      currentUser = uid;
      document.querySelectorAll(".btn-slot").forEach(b => b.classList.remove("active"));
      document.getElementById(`slot-${uid}`).classList.add("active");
      updateHUD();
    }

    function updateHUD() {
      const u = gameState.profiles[currentUser];
      document.getElementById("hud-stats").innerText = `MISSÕES: ${u.completed.length} • XP: ${u.xp}`;

      const am = gameState.profiles.amanda;
      const ay = gameState.profiles.aymara;

      document.getElementById("pts-amanda").innerText = `${am.completed.length} missões`;
      document.getElementById("relics-amanda").innerText = (am.relics || []).join(" ");

      document.getElementById("pts-aymara").innerText = `${ay.completed.length} missões`;
      document.getElementById("relics-aymara").innerText = (ay.relics || []).join(" ");

      document.getElementById("room-target").value = gameState.room;

      const boxA = document.getElementById("box-amanda");
      const boxAy = document.getElementById("box-aymara");
      boxA.className = "duelist-tag";
      boxAy.className = "duelist-tag";

      if (am.completed.length > ay.completed.length) boxA.classList.add("winning");
      else if (ay.completed.length > am.completed.length) boxAy.classList.add("winning");
    }

    window.addEventListener("DOMContentLoaded", () => {
      setGameTheme("bts");
      updateHUD();
      syncCloud();
      gameLoop();
    });
  </script>
</body>
</html>
